services:
  mongodb:
    image: mongodb/mongodb-community-server:7.0.40-ubuntu2204
    entrypoint:
      - mongod
    command:
      - --bind_ip_all
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 })"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
      - .:/lab:ro

  redis:
    profiles:
      - familles
    image: redis:7.4-alpine
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  hbase:
    profiles:
      - bigdata
    build:
      context: ./docker/hbase
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/hbase-healthcheck.sh
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:16010:16010"
    volumes:
      - hbase-data:/data/hbase
      - .:/lab:ro

  spark:
    profiles:
      - bigdata
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - /lab/demos/spark-demo.py
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - .:/lab:ro

volumes:
  hbase-data:
  mongodb-data:
